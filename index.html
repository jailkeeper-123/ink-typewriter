<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잉크 타자기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Myeongjo&family=Nanum+Gothic+Coding&family=Nanum+Gothic&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8d8d0;--ink:#1d1d1b;--fs:19px;--lh:1.9;--ls:0px;--ps:.6em;--ind:0em;--font:'Gowun Batang',serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Nanum Gothic',sans-serif;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button,select{background:transparent;border:1px solid var(--ink);border-radius:0;padding:6px 10px;cursor:pointer;min-height:36px}
button:active{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#bar{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--ink)}
#bar .sp{flex:1}
#bar button{min-width:38px;height:38px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center}
#bar .q{font:700 22px/1 'Nanum Gothic Coding',monospace}
button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter}
#bar button.on,.tgt.on{background:var(--ink);color:var(--bg)}
#foot{padding:4px 14px;font-size:12px;opacity:.75;text-align:right;border-top:1px solid var(--ink)}
.lab{font-size:12px;opacity:.7;margin-top:10px}
#hex{width:7.5em;border:1px solid var(--ink);background:transparent;padding:6px;font-family:monospace;border-radius:0}
.chip{position:relative;display:inline-block}
.chip .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;min-height:0;padding:0;font-size:13px;line-height:1;border-radius:50%;background:var(--bg)}
#panel{border-bottom:1px solid var(--ink);padding:10px 12px;max-height:46vh;overflow-y:auto;font-size:14px}
#panel[hidden]{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.sl{display:grid;grid-template-columns:5.5em 1fr 4em;gap:8px;align-items:center;margin:4px 0}
.sl input{width:100%;accent-color:var(--ink)}
.sl output{text-align:right;opacity:.75}
details{margin:8px 0}
summary{cursor:pointer;padding:4px 0}

.sw{width:34px;height:34px;min-height:0;padding:0}
label.chk{display:flex;gap:6px;align-items:center}
#ed{flex:1;overflow-y:auto;box-sizing:border-box;width:100%;max-width:44em;margin:0 auto;padding:24px 18px 55vh;outline:none;font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-break:keep-all;overflow-wrap:break-word;caret-color:var(--ink)}
#ed div{margin:0 0 var(--ps);text-indent:var(--ind);min-height:1em}
::selection{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>
<div id="bar">
  <button id="un" title="되돌리기" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5M4 11h10a4 4 0 0 1 0 8h-3"/></svg></button>
  <button id="re" title="다시 하기" aria-label="다시 하기"><svg viewBox="0 0 24 24"><path d="M15 6l5 5-5 5M20 11H10a4 4 0 0 0 0 8h3"/></svg></button>
  <button id="q2" class="q" aria-label="큰따옴표">"</button>
  <button id="q1" class="q" aria-label="작은따옴표">'</button>
  <span class="sp"></span>
  <button id="tg" title="설정" aria-label="설정"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button id="imp" title="텍스트 파일 열기" aria-label="열기"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg></button>
  <button id="exp" title="txt로 저장" aria-label="저장"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg></button>
  <button id="cp" title="전체 복사" aria-label="복사"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></svg></button>
</div>
<div id="panel" hidden>
  <div class="row">
    <select id="fs_" aria-label="글꼴"></select>
    <button id="addf">🔤 글꼴 파일 추가</button>
  </div>
  <div id="sls"></div>
  <details id="pal" open>
    <summary>팔레트 (접기/펼치기)</summary>
    <div class="row">
      <button id="tb" class="tgt on">배경색 수정</button>
      <button id="ti" class="tgt">글자색 수정</button>
      <input id="hex" maxlength="7" aria-label="색 코드" spellcheck="false">
    </div>
    <div id="csl"></div>
    <div class="row"><button id="reg">＋ 이 색 등록</button></div>
    <div class="lab">등록한 색</div><div class="row" id="favs"></div>
    <div class="lab">최근 쓴 색</div><div class="row" id="hist"></div>
    <div class="lab">기본 조합</div><div class="row" id="pre"></div>
  </details>
  <div class="row">
    <label class="chk"><input type="checkbox" id="tw"> 타자기 스크롤(커서 줄 고정)</label>
    <label class="chk"><input type="checkbox" id="spc"> 스페이스로 닫기</label>
  </div>
  <div class="row"><button id="rst">기본값으로</button></div>
</div>
<div id="ed" contenteditable="true" spellcheck="false" autocapitalize="off" aria-label="원고" role="textbox" aria-multiline="true"></div>
<div id="foot"><span id="cnt"></span></div>
<input type="file" id="fi" accept=".txt,.md,text/plain" hidden>
<input type="file" id="ff" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
<script>
const $=s=>document.querySelector(s),ed=$('#ed'),root=document.documentElement.style;
const DEF={fs:19,lh:1.9,ls:0,ps:.6,ind:0,font:"'Gowun Batang',serif",bg:'#d8d8d0',ink:'#1d1d1b',tw:true,spc:true,hist:[],favs:[]};
const PRE=[['#d8d8d0','#1d1d1b','전자잉크'],['#f1f0ea','#222','종이'],['#2a2a28','#cfcfc6','밤 잉크'],['#e6e1cf','#2b2a24','누런 잉크']];
const FONTS=[["'Gowun Batang',serif",'고운바탕'],["'Nanum Myeongjo',serif",'나눔명조'],["'Nanum Gothic Coding',monospace",'나눔고딕코딩(타자기)'],["'Nanum Gothic',sans-serif",'나눔고딕']];
const R=[['fs','글자 크기',14,34,1,'px'],['lh','줄간격',1,3,.05,''],['ls','글자간격',-1,6,.1,'px'],['ps','문단 간격',0,3,.1,'em'],['ind','들여쓰기',0,4,.5,'em']];
let S={...DEF};
try{const t=JSON.parse(localStorage.getItem('ink-s')||'null');if(t)Object.assign(S,t);else if(matchMedia('(prefers-color-scheme: dark)').matches){S.bg=PRE[2][0];S.ink=PRE[2][1]}}catch(e){}
const saveS=()=>{try{localStorage.setItem('ink-s',JSON.stringify(S))}catch(e){}};
function apply(sk){
  root.setProperty('--bg',S.bg);root.setProperty('--ink',S.ink);root.setProperty('--fs',S.fs+'px');root.setProperty('--lh',S.lh);
  root.setProperty('--ls',S.ls+'px');root.setProperty('--ps',S.ps+'em');root.setProperty('--ind',S.ind+'em');root.setProperty('--font',S.font);
  $('#tw').checked=S.tw;$('#spc').checked=S.spc;$('#fs_').value=S.font;if(!sk)syncColor();
  R.forEach(([k])=>{const i=$('#sl_'+k);if(i){i.value=S[k];i.nextElementSibling.textContent=S[k]+(R.find(r=>r[0]==k)[5])}});
  saveS();
}
/* controls */
const sls=$('#sls');
R.forEach(([k,n,a,b,st,u])=>{const d=document.createElement('div');d.className='sl';d.innerHTML=`<span>${n}</span><input type="range" id="sl_${k}" min="${a}" max="${b}" step="${st}"><output></output>`;sls.append(d);d.querySelector('input').oninput=e=>{S[k]=+e.target.value;apply()}});
FONTS.forEach(([v,n])=>addOpt(v,n));
function addOpt(v,n){const o=document.createElement('option');o.value=v;o.textContent=n;$('#fs_').append(o)}
$('#fs_').onchange=e=>{S.font=e.target.value;apply()};
$('#tw').onchange=e=>{S.tw=e.target.checked;apply()};
$('#spc').onchange=e=>{S.spc=e.target.checked;apply()};
PRE.forEach(([b,i,n])=>{const x=document.createElement('button');x.className='sw';x.title=n;x.setAttribute('aria-label',n);x.style.background=b;x.style.borderColor=i;x.style.boxShadow=`inset 0 0 0 9px ${b}, inset 0 0 0 17px ${i}`;x.onclick=()=>{S.bg=b;S.ink=i;apply()};$('#pre').append(x)});
$('#rst').onclick=()=>{S={...DEF,hist:S.hist,favs:S.favs};apply()};
$('#tg').onclick=()=>{const p=$('#panel');p.hidden=!p.hidden};
$('#addf').onclick=()=>$('#ff').click();
$('#ff').onchange=async e=>{
  for(const f of e.target.files){
    try{const name='U_'+f.name.replace(/\.[^.]+$/,'').replace(/[^\w가-힣]/g,'_');
      const ff=new FontFace(name,await f.arrayBuffer());await ff.load();document.fonts.add(ff);
      addOpt(`'${name}',serif`,f.name.replace(/\.[^.]+$/,''));S.font=`'${name}',serif`;apply();
    }catch(err){alert('글꼴을 불러오지 못했어요: '+f.name)}
  }
  e.target.value='';
};
/* text <-> editor */
const getText=()=>Array.from(ed.childNodes).map(n=>n.textContent).join('\n');
function setText(t){ed.innerHTML='';(t||'').split('\n').forEach(l=>{const d=document.createElement('div');if(l)d.textContent=l;else d.innerHTML='<br>';ed.append(d)});if(!ed.firstChild)ed.innerHTML='<div><br></div>'}
function count(){const t=getText().replace(/\n/g,'');$('#cnt').textContent=`${t.length.toLocaleString()}자 · 공백 제외 ${t.replace(/\s/g,'').length.toLocaleString()}자`}
let tm;function persist(){count();clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('ink-t',getText())}catch(e){}},400)}
try{setText(localStorage.getItem('ink-t')||'')}catch(e){setText('')}
document.execCommand('defaultParagraphSeparator',false,'div');
/* auto pairing */
const P={'"':'"',"'":"'",'[':']','(':')','{':'}','“':'”','‘':'’','「':'」','『':'』'},C=new Set(Object.values(P));
function ch(off){const s=getSelection();if(!s.rangeCount||!s.isCollapsed)return '';const n=s.anchorNode,o=s.anchorOffset;return n&&n.nodeType===3?(n.data[o+off]||''):''}
const fwd=()=>getSelection().modify('move','forward','character');
ed.addEventListener('beforeinput',e=>{
  if(e.isComposing)return;
  const s=getSelection(),nx=ch(0);
  if(e.inputType==='insertText'&&e.data&&e.data.length===1){
    const d=e.data;
    if(C.has(d)&&nx===d){e.preventDefault();fwd();return}
    if(P[d]&&s.isCollapsed){
      if(d==="'"&&/[\p{L}\p{N}]/u.test(ch(-1)))return;
      e.preventDefault();document.execCommand('insertText',false,d+P[d]);s.modify('move','backward','character');return;
    }
    if(d===' '&&S.spc&&C.has(nx)){e.preventDefault();fwd();return}
  }
  if((e.inputType==='insertParagraph'||e.inputType==='insertLineBreak')&&C.has(nx)){e.preventDefault();fwd()}
});
/* typewriter scroll */
function center(){
  if(!S.tw)return;const s=getSelection();if(!s.rangeCount)return;
  const r=s.getRangeAt(0).cloneRange();r.collapse(false);let b=r.getClientRects()[0];
  if(!b){const n=s.anchorNode;const el=n&&(n.nodeType===1?n:n.parentElement);if(el)b=el.getBoundingClientRect()}
  if(!b)return;const eb=ed.getBoundingClientRect(),diff=b.top-(eb.top+eb.height*.42);
  if(Math.abs(diff)>4)ed.scrollTop+=diff;
}
ed.addEventListener('input',()=>{persist();center()});
ed.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)});
/* file in/out */
$('#imp').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(!getText().trim()||confirm('현재 원고를 덮어쓸까요?')){setText(String(r.result).replace(/\r\n?/g,'\n'));persist()}};r.readAsText(f);e.target.value=''};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([getText()],{type:'text/plain'}));a.download='원고.txt';document.body.append(a);a.click();a.remove()};
$('#cp').onclick=async()=>{const b=$('#cp');try{await navigator.clipboard.writeText(getText())}catch(e){const r=document.createRange();r.selectNodeContents(ed);getSelection().removeAllRanges();getSelection().addRange(r)}b.classList.add('on');setTimeout(()=>b.classList.remove('on'),900)};
/* toolbar: keep editor focus so the phone keyboard stays up */
document.querySelectorAll('#bar button').forEach(b=>b.addEventListener('pointerdown',e=>e.preventDefault()));
$('#un').onclick=()=>{ed.focus();document.execCommand('undo');persist()};
$('#re').onclick=()=>{ed.focus();document.execCommand('redo');persist()};
function pair(c){ed.focus();const s=getSelection(),sel=s.isCollapsed?'':s.toString();if(!sel&&ch(0)===P[c]){fwd();return}document.execCommand('insertText',false,c+sel+P[c]);if(!sel)s.modify('move','backward','character');persist();center()}
$('#q2').onclick=()=>pair('"');$('#q1').onclick=()=>pair("'");
/* color editing from the current color */
const hex2hsl=h=>{h=h.replace('#','');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let H=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));H=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;H=Math.round(H*60);if(H<0)H+=360}return[H,Math.round(s*100),Math.round(l*100)]};
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')};
let tgt='bg',ht;
[['ch','색조',0,360],['cs','채도',0,100],['cl','밝기',0,100]].forEach(([id,n,a,b])=>{const d=document.createElement('div');d.className='sl';d.innerHTML=`<span>${n}</span><input type="range" id="${id}" min="${a}" max="${b}"><output></output>`;$('#csl').append(d);d.querySelector('input').oninput=()=>setColor(hsl2hex(+$('#ch').value,+$('#cs').value,+$('#cl').value),true)});
function syncColor(keep){const c=S[tgt];$('#hex').value=c;if(!keep){const[h,s,l]=hex2hsl(c);$('#ch').value=h;$('#cs').value=s;$('#cl').value=l}['ch','cs','cl'].forEach(i=>{$('#'+i).nextElementSibling.textContent=$('#'+i).value})}
function setColor(c,keep){S[tgt]=c;apply(true);syncColor(keep);clearTimeout(ht);ht=setTimeout(()=>pushHist(c),900)}
function pushHist(c){S.hist=[c,...S.hist.filter(x=>x!==c)].slice(0,10);saveS();renderChips()}
function chip(c,rm){const w=document.createElement('span');w.className='chip';const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;b.setAttribute('aria-label',c);b.onclick=()=>setColor(c);w.append(b);if(rm){const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label',c+' 삭제');x.onclick=()=>{S.favs=S.favs.filter(y=>y!==c);saveS();renderChips()};w.append(x)}return w}
function renderChips(){const f=$('#favs'),h=$('#hist');f.replaceChildren(...S.favs.map(c=>chip(c,1)));h.replaceChildren(...S.hist.map(c=>chip(c)));if(!S.favs.length)f.textContent='아직 없어요';if(!S.hist.length)h.textContent='아직 없어요'}
$('#reg').onclick=()=>{const c=S[tgt];if(!S.favs.includes(c))S.favs=[...S.favs,c].slice(-16);saveS();renderChips()};
$('#tb').onclick=()=>{tgt='bg';$('#tb').classList.add('on');$('#ti').classList.remove('on');syncColor()};
$('#ti').onclick=()=>{tgt='ink';$('#ti').classList.add('on');$('#tb').classList.remove('on');syncColor()};
$('#hex').onchange=e=>{let v=e.target.value.trim().toLowerCase();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{3}$/.test(v))v='#'+[...v.slice(1)].map(x=>x+x).join('');if(/^#[0-9a-f]{6}$/.test(v)){setColor(v);pushHist(v)}else syncColor()};
apply();renderChips();count();ed.focus();
</script>
</body>
</html>
